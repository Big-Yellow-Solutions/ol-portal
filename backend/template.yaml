AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: OL Portal backend — DynamoDB data layer, Lambda API, Cognito or WorkOS auth.

Parameters:
  AuthProvider:
    Type: String
    Default: cognito
    AllowedValues: [cognito, workos]
    Description: >-
      Which claim shape the API and The Optimist expect. Set to workos together
      with flipping PortalApi's DefaultAuthorizer to WorkosLambda; the two must
      move as a pair. The Cognito pool is kept either way so the switch can be
      reversed by putting both back.
  WorkosClientId:
    Type: String
    Default: ""
    Description: >-
      WorkOS AuthKit client id. Required when AuthProvider=workos; it is also
      the JWKS path segment. Not a secret. Staging is
      client_01M10FCE1QJW4DH3XRNDG6EEFZ.
  WorkosSecretId:
    Type: String
    Default: WorkOs
    Description: >-
      Secrets Manager secret holding the WorkOS API key (a JSON object keyed
      "WorkOS", or a bare string). Environment-scoped by WorkOS, so the staging
      and production stacks point at different secrets.
  WorkosTokenIssuer:
    Type: String
    Default: ""
    Description: >-
      Overrides the expected `iss` claim. Leave empty: it is derived from
      WorkosClientId as https://api.workos.com/user_management/<client id>,
      which is what AuthKit actually signs tokens with. Set it only for a
      custom auth domain.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256
    # Architectures deliberately isn't set here: SAM's Globals merge
    # concatenates list properties instead of overriding them, so a per-
    # function override (needed by ContractPdfFunction, see below) combined
    # with a Globals default here produces an invalid 2-element list. Every
    # function below sets Architectures explicitly instead.

Resources:
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ol-portal-files-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - https://portal.optimisticlabs.com
              - https://main.d2rvkunvze2ixv.amplifyapp.com
              - http://localhost:8761
            AllowedMethods: [PUT, GET]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-analyzer
      CodeUri: src/
      Handler: analyzer.handler
      Architectures: [arm64]
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
          ANTHROPIC_KEY_PARAM: /ol-portal/anthropic-api-key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable
        - S3ReadPolicy:
            BucketName: !Sub ol-portal-files-${AWS::AccountId}
        - SSMParameterReadPolicy:
            ParameterName: ol-portal/anthropic-api-key
      Events:
        FileUploaded:
          Type: S3
          Properties:
            Bucket: !Ref FilesBucket
            Events: s3:ObjectCreated:*
            # Only the Files page's own uploads. Resource Library files land
            # under resources/ and have no FILE record to write an analysis
            # onto, so without this prefix every resource upload would spend a
            # Lambda invocation to log "no FILE record" and stop.
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

  PortalTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ol-portal
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ol-portal
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: You're invited to the Optimistic Labs Portal
          EmailMessage: >-
            Hi! You've been invited to the Optimistic Labs Portal.
            Sign in with your email ({username}) and the temporary password
            {####} at https://portal.optimisticlabs.com/login.html
            within 7 days. You'll choose your own password and set up
            two-factor authentication on first sign-in.
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      # PRD 2.3: 12+ chars, upper/lower/number required (3 character classes).
      # Cognito cannot express "any 3 of 4", so symbols stay optional.
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      # TOTP 2FA. OPTIONAL per Teddy's 7/15 call (Cognito can't exempt
      # individual users under "ON", and liz/aliza shouldn't be forced):
      # nobody is challenged unless they enroll a token; flip back to "ON"
      # to restore the PRD 2.5 mandatory stance.
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      # PRD 2.6: audit log of auth events, written by the post-auth trigger.
      LambdaConfig:
        PostAuthentication: !GetAtt AuthEventsFunction.Arn

  AuthEventsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthEventsFunction
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  AuthEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-auth-events
      CodeUri: src/
      Handler: authevents.handler
      Architectures: [arm64]
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: portal-web
      GenerateSecret: false
      # PRD 2.4: no account-enumeration leakage from sign-in / forgot-password.
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref UserPool

  LabLeaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: LabLeader
      UserPoolId: !Ref UserPool

  ContributorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Contributor
      UserPoolId: !Ref UserPool

  # Verifies WorkOS access tokens in front of every API route. Created
  # unconditionally so a switch to workos is a parameter change rather than a
  # new resource; it is simply unreferenced while Cognito is the authorizer.
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-authorizer
      CodeUri: src/
      Handler: authorizer.handler
      Architectures: [arm64]
      # Runs in front of every request: keep it small and quick. The JWKS is
      # cached in the container after the first verification.
      Timeout: 5
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
          WORKOS_CLIENT_ID: !Ref WorkosClientId
          WORKOS_TOKEN_ISSUER: !Ref WorkosTokenIssuer
      Policies:
        # Writes the PRD 2.6 sign-in audit row, which WorkOS has no
        # PostAuthentication trigger to produce.
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable

  # SAM does not emit an invoke permission for an HTTP API Lambda authorizer
  # declared with FunctionArn — it does for every route it wires itself, which
  # is why the other functions in this stack have one and this one did not.
  # Without it API Gateway's call is refused and every authenticated request
  # fails as a 500 before the authorizer ever runs. The authorizer id is not
  # knowable here (it would be circular), so the source is the api's whole
  # authorizer namespace.
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AuthorizerFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${PortalApi}/authorizers/*

  PortalApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://portal.optimisticlabs.com
          - https://main.d2rvkunvze2ixv.amplifyapp.com
          - http://localhost:8761
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, X-Act-As]
      Auth:
        # THE CUTOVER LINE. Change to WorkosLambda and redeploy with
        # AuthProvider=workos; change back to revert. It cannot be driven by
        # the AuthProvider parameter directly — SAM resolves this at transform
        # time and rejects an intrinsic here — so the switch is deliberately
        # two coordinated edits rather than one, and Cognito stays untouched
        # until both are made.
        DefaultAuthorizer: WorkosLambda
        Authorizers:
          CognitoJwt:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
            IdentitySource: $request.header.Authorization
          # WorkOS cannot use the JWT authorizer above: that one resolves keys
          # through OIDC discovery, and api.workos.com serves no discovery
          # document (404). See backend/src/authz.mjs.
          WorkosLambda:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: 2.0
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
              # No result caching. Caching keys on the token, so an expired
              # token would keep being accepted for the cache window; a
              # verification against an already-warm JWKS is cheap enough that
              # correctness is the better trade for a seven-person tool.
              ReauthorizeEvery: 0

  # Daily generator for recurring deal instances + opt-in auto invoice requests (PRD 3.9/3.10)
  RecurringFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-recurring
      CodeUri: src/
      Handler: recurring.handler
      Architectures: [arm64]
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(15 6 * * ? *)

  # Renders a contract OR a live proposal draft to PDF and stores it as a FILE
  # record (PRD 3.6 follow-on + The Optimist's "Draft PDF" action). Logical
  # id/FunctionName kept as "ContractPdf" to avoid an unnecessary Lambda
  # replacement now that it serves both — see backend/src/pdf/index.mjs.
  # Own CodeUri (src/pdf/) so puppeteer-core + @sparticuz/chromium don't bloat
  # every other function's bundle.
  ContractPdfFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-contract-pdf
      CodeUri: src/pdf/
      Handler: index.handler
      # @sparticuz/chromium@131 ships an x86_64-only Chromium build (no ARM
      # binary yet, per its own README) — override the Globals arm64 default
      # here or the bundled binary fails to exec on Lambda's Graviton runtime.
      Architectures: [x86_64]
      # HTTP API caps integrations at 29s; headless-Chromium cold start + render
      # needs most of it. MemorySize is generous because Lambda CPU scales with
      # memory — Chromium launches noticeably faster above ~1.5GB.
      Timeout: 28
      MemorySize: 2048
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
          FILES_BUCKET: !Ref FilesBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable
        - S3CrudPolicy:
            BucketName: !Sub ol-portal-files-${AWS::AccountId}
      Events:
        PdfRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /contracts/{id}/pdf
            Method: POST
        ProposalPdfRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /proposals/{id}/pdf
            Method: POST

  # The Optimist's chat. Its own function purely because it streams: API
  # Gateway buffers an integration response and caps it at 29s, so an
  # assistant that should paint words as it writes them cannot live on the
  # HTTP API at all. A Function URL is the only Lambda surface that streams.
  #
  # A Function URL has no JWT authorizer available to it, so AuthType is NONE
  # and the handler verifies the Cognito ID token itself (aws-jwt-verify,
  # against the pool and client below) before it touches any data. That check
  # is the whole gate: treat optimist-stream.mjs's validate() as security
  # code, not plumbing.
  OptimistFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-optimist
      CodeUri: src/
      Handler: optimist-stream.handler
      Architectures: [arm64]
      # No 29s ceiling here. A question that fans out across several retrieval
      # tools and then writes a long answer legitimately runs past a minute,
      # and the person is watching it arrive the whole time.
      Timeout: 300
      # Lambda CPU scales with memory: more here is a faster first token, and
      # the function is billed for a fraction of a second of compute either way.
      MemorySize: 1024
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
          ANTHROPIC_KEY_PARAM: /ol-portal/anthropic-api-key
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          # A Function URL has no authorizer, so this function verifies the
          # token itself under whichever provider is live.
          AUTH_PROVIDER: !Ref AuthProvider
          WORKOS_CLIENT_ID: !Ref WorkosClientId
          WORKOS_TOKEN_ISSUER: !Ref WorkosTokenIssuer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable
        - SSMParameterReadPolicy:
            ParameterName: ol-portal/anthropic-api-key
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - https://portal.optimisticlabs.com
            - https://main.d2rvkunvze2ixv.amplifyapp.com
            - http://localhost:8761
            - http://localhost:3000
          AllowMethods: [POST]
          AllowHeaders: [authorization, content-type, x-act-as]
          MaxAge: 3600

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ol-portal-api
      CodeUri: src/
      Handler: app.handler
      Architectures: [arm64]
      # HTTP API caps responses at 29s; the AI proposal assistant needs most of it.
      Timeout: 28
      Environment:
        Variables:
          TABLE_NAME: !Ref PortalTable
          ANTHROPIC_KEY_PARAM: /ol-portal/anthropic-api-key
          FILES_BUCKET: !Ref FilesBucket
          FRONTEND_URL: https://portal.optimisticlabs.com
          QBO_CREDS_PARAM: /ol-portal/qbo-credentials
          QBO_ENV: sandbox
          # Hardcoded (like the frontend's config.js): !Sub ${PortalApi} here would
          # be circular, since the HttpApi routes already reference this function.
          # Must exactly match a redirect URI registered in the Intuit dashboard.
          QBO_REDIRECT_URI: https://0y24y7945l.execute-api.us-east-1.amazonaws.com/qbo/callback
          # Same reasoning as QBO_REDIRECT_URI above: hardcoded because !Sub
          # ${PortalApi} here would be circular. Must exactly match the
          # redirect URI registered on the DocuSign Integration Key, and the
          # Connect webhook's "Send to" URL configured in registerConnectWebhook().
          DOCUSIGN_CREDS_PARAM: /ol-portal/docusign-credentials
          DOCUSIGN_ENV: demo
          DOCUSIGN_REDIRECT_URI: https://0y24y7945l.execute-api.us-east-1.amazonaws.com/docusign/callback
          DOCUSIGN_WEBHOOK_URL: https://0y24y7945l.execute-api.us-east-1.amazonaws.com/docusign/webhook
          USER_POOL_ID: !Ref UserPool
          # Base Contract PRD FR15: on full execution, signing.mjs invokes the
          # PDF renderer directly to produce the countersigned copy. Not
          # circular — the PDF function depends only on the API *gateway*, not
          # on this function.
          PDF_FUNCTION_NAME: !Ref ContractPdfFunction
          # Tells identity.mjs which claim shape the authorizer handed over.
          AUTH_PROVIDER: !Ref AuthProvider
          # The WorkOS *API key* — a secret, unlike the client id. Held in
          # Secrets Manager and read at runtime, never built into anything.
          # (Secrets Manager rather than the SSM SecureString the other
          # integrations use, because that is where this key lives.)
          WORKOS_SECRET_ID: !Ref WorkosSecretId
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PortalTable
        - S3CrudPolicy:
            BucketName: !Sub ol-portal-files-${AWS::AccountId}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${WorkosSecretId}-*"
        - SSMParameterReadPolicy:
            ParameterName: ol-portal/qbo-credentials
        - SSMParameterReadPolicy:
            ParameterName: ol-portal/docusign-credentials
        - SSMParameterReadPolicy:
            ParameterName: ol-portal/anthropic-api-key
        # Base Contract PRD FR15: render the countersigned PDF at execution time.
        - LambdaInvokePolicy:
            FunctionName: !Ref ContractPdfFunction
        # PRD 2.2/2.5: invite lifecycle + admin 2FA reset (admin routes only)
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminSetUserMFAPreference
                - cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn
        # PRD 3.5: emailing a sent proposal's link to the client. SES resolves
        # IAM authorization against whichever identity ARN most specifically
        # matches the From address — the optimisticlabs.com domain ARN alone
        # isn't enough for addresses (like hello@) that are ALSO independently
        # verified as their own identity, so this covers every identity in
        # the account rather than trying to enumerate them.
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        GetRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /{proxy+}
            Method: GET
        PostRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /{proxy+}
            Method: POST
        PatchRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /{proxy+}
            Method: PATCH
        DeleteRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /{proxy+}
            Method: DELETE
        # Intuit's OAuth redirect cannot carry a Cognito JWT; the handler's
        # state check (CSRF) protects this route instead.
        QboCallbackRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /qbo/callback
            Method: GET
            Auth:
              Authorizer: NONE
        # Customer-facing proposal view + decision (PRD 3.5). Clients aren't
        # portal users, so no JWT; the per-proposal share token is the credential.
        ShareGetRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /share/{proxy+}
            Method: GET
            Auth:
              Authorizer: NONE
        SharePostRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /share/{proxy+}
            Method: POST
            Auth:
              Authorizer: NONE
        # Customer-facing contract signing (Base Contract PRD 5.5). Same model
        # as /share: the client has no portal account, and the per-contract
        # signing token minted at send time is the only credential. GET serves
        # the frozen document and, once executed, the countersigned PDF.
        SignGetRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /sign/{proxy+}
            Method: GET
            Auth:
              Authorizer: NONE
        SignPostRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /sign/{proxy+}
            Method: POST
            Auth:
              Authorizer: NONE
        # DocuSign's consent redirect and Connect webhook both arrive without a
        # Cognito JWT — the browser is coming back from account-d.docusign.com,
        # and the webhook is a server-to-server POST. The callback is protected
        # by the fact that a code alone grants nothing (JWT Grant never exchanges
        # it), and the webhook by its HMAC signature check.
        DocuSignCallbackRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /docusign/callback
            Method: GET
            Auth:
              Authorizer: NONE
        DocuSignWebhookRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref PortalApi
            Path: /docusign/webhook
            Method: POST
            Auth:
              Authorizer: NONE

Outputs:
  OptimistUrl:
    Description: Streaming chat endpoint. Set as NEXT_PUBLIC_OPTIMIST_URL on the Amplify app.
    Value: !GetAtt OptimistFunctionUrl.FunctionUrl
  ApiUrl:
    Value: !Sub https://${PortalApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  TableName:
    Value: !Ref PortalTable
